<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vokabeln">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Vokabel-Heft</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: one narrow column like a Heft page; grid-paper ground, big thumb-sized buttons */
:root {
  --paper: #fbfcfe;
  --grid: #dfe7f3;
  --ink: #1c2a44;
  --ink-soft: #5b6a86;
  --line: #c9d4e6;
  --card: #ffffff;
  --accent: #2b5fd9;
  --accent-ink: #ffffff;
  --marker: #ffe45c;
  --good: #1f9d55;
  --good-bg: #e3f6ea;
  --bad: #d64545;
  --bad-bg: #fde8e8;
  --font-display: "Fredoka", "Nunito", system-ui, sans-serif;
  --font-body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #121826; --grid: #1d2638; --ink: #e8eefb; --ink-soft: #9aa8c4; --line: #2c3850; --card: #182133;
  --accent: #6f9bff; --accent-ink: #0d1424; --marker: #e3c83a; --good: #4fd18b; --good-bg: #16352a; --bad: #ff7b7b; --bad-bg: #3a1c22; color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #121826; --grid: #1d2638; --ink: #e8eefb; --ink-soft: #9aa8c4; --line: #2c3850; --card: #182133;
  --accent: #6f9bff; --accent-ink: #0d1424; --marker: #e3c83a; --good: #4fd18b; --good-bg: #16352a; --bad: #ff7b7b; --bad-bg: #3a1c22; color-scheme: dark }

* { box-sizing: border-box; }
body {
  background-color: var(--paper);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 22px 22px;
  color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 40px;
}
.wrap { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 600; margin: 0; text-wrap: balance; }
h1 { font-size: 1.7rem; }
h2 { font-size: 1.35rem; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.muted { color: var(--ink-soft); }
.small { font-size: .85rem; }

.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.who { display: flex; align-items: center; gap: 8px; background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px 6px 6px; font-weight: 700; }
.avatar { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-family: var(--font-display); color: #fff; font-size: 1rem; }
.icon-btn { background: var(--card); border: 1px solid var(--line); border-radius: 12px; width: 44px; height: 44px; display: grid; place-items: center; font-size: 1.2rem; }

.panel { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.demo-note { background: var(--marker); color: #1c2a44; border-radius: 10px; padding: 8px 12px; font-size: .85rem; font-weight: 700; }

.langs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.chip { border: 2px solid var(--line); background: var(--card); border-radius: 14px; padding: 10px 6px; font-weight: 800; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.chip .flag { font-family: var(--font-display); font-size: 1.15rem; letter-spacing: .04em; }
.chip[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--card)); }

.dir { display: flex; align-items: center; gap: 10px; justify-content: center; border: 2px dashed var(--line); border-radius: 14px; padding: 10px; background: transparent; font-weight: 800; width: 100%; }
.dir .swap { font-size: 1.3rem; color: var(--accent); }

.big { border: 0; border-radius: 18px; padding: 18px; font-family: var(--font-display); font-size: 1.25rem; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; min-height: 64px; }
.big.primary { background: var(--accent); color: var(--accent-ink); }
.big.secondary { background: var(--card); border: 2px solid var(--line); }
.big:disabled { opacity: .45; cursor: not-allowed; }
.hint-line { text-align: center; }

.import-info { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-size: .9rem; }
.tag { display: inline-block; border-radius: 6px; padding: 1px 8px; background: color-mix(in srgb, var(--accent) 14%, transparent); font-weight: 700; font-size: .8rem; }

/* settings drawer */
.settings { display: grid; gap: 12px; }
.field { display: grid; gap: 4px; }
.field label { font-weight: 800; font-size: .85rem; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-soft); }
select { font: inherit; color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 10px; width: 100%; }
.toggle { display: flex; align-items: center; gap: 10px; font-weight: 700; }
.toggle input { width: 20px; height: 20px; accent-color: var(--accent); }

/* user picker */
.people { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.person { background: var(--card); border: 2px solid var(--line); border-radius: 18px; padding: 16px 10px; display: flex; flex-direction: column; align-items: center; gap: 8px; font-weight: 800; font-size: 1.05rem; }
.person .avatar { width: 54px; height: 54px; font-size: 1.5rem; }
.add-row { display: flex; gap: 8px; }
.add-row input { flex: 1; min-width: 0; font: inherit; color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.add-row button { border: 0; background: var(--accent); color: var(--accent-ink); border-radius: 12px; padding: 0 16px; font-weight: 800; }

/* practice */
.progress { height: 10px; background: var(--grid); border-radius: 99px; overflow: hidden; }
.progress > span { display: block; height: 100%; background: var(--accent); transition: width .3s; }
.p-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-weight: 700; }
.card {
  background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 22px 18px 18px;
  display: flex; flex-direction: column; gap: 16px; position: relative;
  background-image: linear-gradient(90deg, transparent 38px, color-mix(in srgb, var(--bad) 45%, transparent) 38px, color-mix(in srgb, var(--bad) 45%, transparent) 40px, transparent 40px);
  padding-left: 54px;
}
.prompt-label { font-size: .8rem; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-soft); }
.prompt-row { display: flex; align-items: center; gap: 12px; }
.prompt { font-family: var(--font-display); font-size: 2rem; font-weight: 600; line-height: 1.15; overflow-wrap: anywhere; min-width: 0; flex: 1; }
.speak { flex: none; width: 52px; height: 52px; border-radius: 50%; border: 2px solid var(--line); background: var(--paper); font-size: 1.4rem; display: grid; place-items: center; }
.speak.on { border-color: var(--accent); }

.answer-row { display: flex; gap: 8px; }
.answer-row input { flex: 1; min-width: 0; font: inherit; font-size: 1.15rem; color: var(--ink); background: var(--paper); border: 2px solid var(--line); border-radius: 14px; padding: 12px; }
.answer-row .check { border: 0; background: var(--ink); color: var(--paper); border-radius: 14px; padding: 0 16px; font-weight: 800; }
.mic { border: 0; border-radius: 18px; min-height: 72px; width: 100%; background: var(--accent); color: var(--accent-ink); font-family: var(--font-display); font-size: 1.25rem; display: flex; align-items: center; justify-content: center; gap: 10px; }
.mic.listening { background: var(--bad); color: #fff; animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(.98); box-shadow: 0 0 0 8px color-mix(in srgb, var(--bad) 25%, transparent); } }
@media (prefers-reduced-motion: reduce) { .mic.listening { animation: none; } .progress > span { transition: none; } }
.kbhint { background: color-mix(in srgb, var(--marker) 35%, var(--card)); border-radius: 12px; padding: 10px 12px; font-size: .9rem; }
.ghost-input { position: absolute; left: 0; bottom: 0; width: 1px; height: 1px; opacity: 0; border: 0; padding: 0; font-size: 16px; }
.big-answer input { font-size: 1.3rem; padding: 16px 14px; }
.or { text-align: center; margin: -8px 0 -6px; }
.partial { min-height: 1.4em; font-style: italic; color: var(--ink-soft); text-align: center; }
.reveal { background: none; border: 0; text-decoration: underline; text-underline-offset: 3px; color: var(--ink-soft); font-weight: 700; padding: 6px; align-self: center; }

.feedback { border-radius: 14px; padding: 14px; display: grid; gap: 6px; }
.feedback.good { background: var(--good-bg); }
.feedback.bad { background: var(--bad-bg); }
.feedback.neutral { background: color-mix(in srgb, var(--marker) 35%, var(--card)); }
.fb-title { font-family: var(--font-display); font-size: 1.3rem; }
.feedback.good .fb-title { color: var(--good); }
.feedback.bad .fb-title { color: var(--bad); }
.solution { font-family: var(--font-display); font-size: 1.4rem; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.solution .speak { width: 40px; height: 40px; font-size: 1.1rem; }
.selfrate { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.selfrate button { border: 0; border-radius: 14px; padding: 14px 8px; font-weight: 800; font-size: 1rem; }
.selfrate .yes { background: var(--good); color: #fff; }
.selfrate .no { background: var(--bad); color: #fff; }
.next { border: 0; border-radius: 14px; padding: 14px; background: var(--ink); color: var(--paper); font-weight: 800; font-size: 1.05rem; width: 100%; }

/* results & stats */
.score { display: flex; gap: 10px; }
.score div { flex: 1; border-radius: 14px; padding: 12px; text-align: center; }
.score b { display: block; font-family: var(--font-display); font-size: 2rem; font-variant-numeric: tabular-nums; }
.score .g { background: var(--good-bg); color: var(--good); }
.score .b { background: var(--bad-bg); color: var(--bad); }
.wordlist { list-style: none; margin: 0; padding: 0; display: grid; }
.wordlist li { display: grid; grid-template-columns: 22px 1fr auto; gap: 10px; align-items: center; padding: 9px 0; border-bottom: 1px dashed var(--line); }
.wordlist li:last-child { border-bottom: 0; }
.wordlist .w { min-width: 0; overflow-wrap: anywhere; }
.wordlist .w small { display: block; color: var(--ink-soft); }
.rate { width: 74px; display: grid; gap: 3px; justify-items: end; font-size: .8rem; font-weight: 800; font-variant-numeric: tabular-nums; }
.bar { width: 74px; height: 7px; border-radius: 99px; background: var(--grid); overflow: hidden; }
.bar span { display: block; height: 100%; }
.dot { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: .8rem; font-weight: 800; }
.dot.g { background: var(--good); } .dot.b { background: var(--bad); } .dot.n { background: var(--line); color: var(--ink-soft); }
.row-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.row-btns button { border-radius: 14px; padding: 14px 8px; font-weight: 800; border: 2px solid var(--line); background: var(--card); }
.row-btns button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.linkish { background: none; border: 0; color: var(--accent); font-weight: 800; padding: 4px 0; text-align: left; }
.empty { text-align: center; padding: 10px; }
.chip.empty-lang { opacity: .6; }
.avatar.has-icon { font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif; font-size: 1.05rem; }
.person .avatar.has-icon { font-size: 1.9rem; }
/* 10-Sekunden-Erklärfilm (reines CSS, läuft in Schleife) */
.demo { display: grid; gap: 12px; }
.demo-stage { position: relative; height: 250px; border-radius: 14px; background: var(--paper); border: 1px solid var(--line); overflow: hidden;
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 16px 16px; }
.sc { position: absolute; inset: 0; display: grid; place-items: center; align-content: center; gap: 12px; padding: 14px; opacity: 0; }
.sc1 { animation: sc1 10s infinite; } .sc2 { animation: sc2 10s infinite; } .sc3 { animation: sc3 10s infinite; }
@keyframes sc1 { 0%, 29% { opacity: 1 } 32%, 100% { opacity: 0 } }
@keyframes sc2 { 0%, 31% { opacity: 0 } 34%, 62% { opacity: 1 } 65%, 100% { opacity: 0 } }
@keyframes sc3 { 0%, 64% { opacity: 0 } 67%, 96% { opacity: 1 } 99%, 100% { opacity: 0 } }
.d-btn { position: relative; background: var(--accent); color: var(--accent-ink); font-family: var(--font-display); font-weight: 600; padding: 12px 16px; border-radius: 14px; animation: dpress 10s infinite; }
@keyframes dpress { 0%, 8% { transform: scale(1) } 10% { transform: scale(.94) } 12%, 100% { transform: scale(1) } }
.d-tap { position: absolute; left: 70%; top: 50%; width: 26px; height: 26px; margin: -13px; border-radius: 50%; background: color-mix(in srgb, var(--ink) 35%, transparent); opacity: 0; animation: dtap 10s infinite; }
@keyframes dtap { 0%, 6% { opacity: 0; transform: scale(.4) } 9% { opacity: 1; transform: scale(1) } 14%, 100% { opacity: 0; transform: scale(1.8) } }
.d-photo { width: 86px; height: 60px; border-radius: 6px; background: var(--card); border: 2px solid var(--ink); box-shadow: 0 4px 10px rgba(0,0,0,.15); display: grid; align-content: space-evenly; padding: 6px 8px; opacity: 0; animation: dphoto 10s infinite; }
.d-photo i { display: block; height: 3px; border-radius: 2px; background: var(--ink-soft); }
.d-photo i:nth-child(odd) { width: 80%; }
@keyframes dphoto { 0%, 14% { opacity: 0; transform: translateY(30px) rotate(-8deg) } 19%, 29% { opacity: 1; transform: none } 32%, 100% { opacity: 0 } }
.d-page { position: relative; width: min(260px, 90%); background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; display: grid; gap: 4px; overflow: hidden; }
.d-row { display: flex; justify-content: space-between; gap: 10px; font-size: .9rem; border-bottom: 1px dashed var(--line); padding: 3px 0; font-style: italic; color: var(--accent); }
.d-row b { color: var(--ink); font-weight: 700; }
.d-scan { position: absolute; left: 0; right: 0; height: 3px; background: var(--marker); box-shadow: 0 0 12px 4px color-mix(in srgb, var(--marker) 70%, transparent); top: 0; animation: dscan 10s infinite; }
@keyframes dscan { 0%, 35% { top: 0; opacity: 0 } 37% { opacity: 1 } 50% { top: 100%; opacity: 1 } 52%, 100% { top: 100%; opacity: 0 } }
.d-badge { background: var(--good); color: #fff; font-weight: 800; padding: 6px 12px; border-radius: 999px; font-size: .9rem; opacity: 0; animation: dbadge 10s infinite; }
@keyframes dbadge { 0%, 50% { opacity: 0; transform: scale(.6) } 53%, 62% { opacity: 1; transform: scale(1) } 65%, 100% { opacity: 0 } }
.d-card { width: min(260px, 90%); background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; display: grid; gap: 6px; }
.d-card small { font-weight: 800; letter-spacing: .08em; color: var(--ink-soft); font-size: .7rem; }
.d-word { font-family: var(--font-display); font-size: 1.4rem; font-weight: 600; }
.d-mic { background: var(--accent); color: var(--accent-ink); border-radius: 12px; padding: 8px; text-align: center; font-weight: 700; animation: dmic 10s infinite; }
@keyframes dmic { 0%, 70% { background: var(--accent) } 72%, 80% { background: var(--bad) } 82%, 100% { background: var(--accent) } }
.d-ans { border: 2px solid var(--line); border-radius: 10px; padding: 5px 8px; min-height: 1.9em; }
.d-typed { display: inline-block; overflow: hidden; white-space: nowrap; vertical-align: bottom; width: 0; animation: dtype 10s infinite; }
@keyframes dtype { 0%, 74% { width: 0 } 82%, 100% { width: 5.5em } }
.d-ok { color: var(--good); font-family: var(--font-display); font-weight: 600; opacity: 0; animation: dok 10s infinite; }
@keyframes dok { 0%, 83% { opacity: 0 } 86%, 100% { opacity: 1 } }
.demo-steps { margin: 0; padding-left: 1.3em; display: grid; gap: 4px; }
.st { opacity: .45; } .st1 { animation: st1 10s infinite; } .st2 { animation: st2 10s infinite; } .st3 { animation: st3 10s infinite; }
@keyframes st1 { 0%, 31% { opacity: 1 } 33%, 100% { opacity: .45 } }
@keyframes st2 { 0%, 32% { opacity: .45 } 34%, 64% { opacity: 1 } 66%, 100% { opacity: .45 } }
@keyframes st3 { 0%, 65% { opacity: .45 } 67%, 100% { opacity: 1 } }
@media (prefers-reduced-motion: reduce) {
  .demo-stage { display: none; }
  .st { opacity: 1 !important; animation: none !important; }
}
.howto-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.howto ol { margin: 0; padding-left: 1.2em; display: grid; gap: 8px; }

.thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 8px; }
.thumb { position: relative; aspect-ratio: 3 / 4; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); background: var(--grid); max-width: 100%; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb-x { position: absolute; top: 4px; right: 4px; width: 28px; height: 28px; border-radius: 50%; border: 0; background: rgba(0,0,0,.6); color: #fff; font-size: .8rem; }
.thumb-n { position: absolute; left: 6px; bottom: 4px; color: #fff; font-weight: 800; text-shadow: 0 1px 3px rgba(0,0,0,.7); }
.spinner { width: 46px; height: 46px; margin: 8px auto; border-radius: 50%; border: 5px solid var(--grid); border-top-color: var(--accent); animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 3s; } }
</style>

</head>
<body>
<div class="wrap" id="app"></div>

<script>
(() => {
  /* ---------- Beispiel-Vokabeln (Prototyp; später kommen sie aus den Fotos) ---------- */
  const LANGS = {
    fr: { name: "Französisch", short: "FR", tts: "fr-FR", dict: "fr" },
    en: { name: "Englisch",    short: "EN", tts: "en-GB", dict: "en" },
    es: { name: "Spanisch",    short: "ES", tts: "es-ES", dict: "es" },
  };
  const API = "https://n8n.haraldschwack.at/webhook/vokabel";
  const IS_IOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  let VOCAB = [];
  const COLORS = ["#2b5fd9", "#d6457a", "#1f9d55", "#c77a12", "#7b4bd6", "#0f8f9c"];

  /* ---------- Speicher pro Gerät ---------- */
  const store = {
    get(k, d) { try { const v = localStorage.getItem("vh_" + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem("vh_" + k, JSON.stringify(v)); } catch {} },
  };
  const S = {
    users: store.get("users", ["Johanna", "Sophia", "Maximilian"]),
    me: store.get("me", null),
    lang: store.get("lang", "fr"),
    dir: store.get("dir", "de2fx"),
    mode: store.get("mode", "current"),
    cat: "all",
    count: store.get("count", 20),
    autoSpeak: store.get("autoSpeak", true),
    showSettings: false,
    showHelp: !store.get("helpSeen", false),
    view: null,
    session: null,
  };
  const save = () => ["users","me","lang","dir","mode","count","autoSpeak"].forEach(k => store.set(k, S[k]));
  /* Wörter + Fortschritt kommen vom Server (n8n), Kopie liegt am Gerät */
  const fromRow = r => ({ id: r.id, lang: r.lang, cat: r.cat || "Allgemein", date: r.importDate || "", importId: r.importId || "", de: r.de, fx: r.fx,
    r: Number(r.rightCount) || 0, w: Number(r.wrongCount) || 0, last: r.lastPracticed || "" });
  const cacheWords = () => store.set("words_" + S.me, VOCAB);
  const getStats = () => Object.fromEntries(VOCAB.filter(w => w.r + w.w > 0).map(w => [w.id, { r: w.r, w: w.w, last: w.last }]));
  let pending = new Set(store.get("pending_" + (S.me || ""), []));
  const markPending = id => { pending.add(id); store.set("pending_" + S.me, [...pending]); };
  const setStats = st => { VOCAB.forEach(w => { const e = st[w.id]; if (e && (e.r !== w.r || e.w !== w.w)) { w.r = e.r; w.w = e.w; w.last = e.last; markPending(w.id); } }); cacheWords(); };
  const pickDefaultLang = () => { if (!VOCAB.some(w => w.lang === S.lang) && VOCAB.length) { const latest = VOCAB.reduce((m, w) => w.date > m.date ? w : m, VOCAB[0]); S.lang = latest.lang; save(); } };
  const loadWords = async () => {
    pending = new Set(store.get("pending_" + S.me, []));
    VOCAB = store.get("words_" + S.me, []); pickDefaultLang();
    S.loading = !VOCAB.length; render();
    try {
      const res = await fetch(API + "/words?user=" + encodeURIComponent(S.me));
      const data = await res.json();
      const server = (data.words || []).map(fromRow);
      const local = Object.fromEntries(VOCAB.map(w => [w.id, w]));
      VOCAB = server.map(w => pending.has(w.id) && local[w.id] ? { ...w, r: local[w.id].r, w: local[w.id].w, last: local[w.id].last } : w);
      cacheWords(); S.offline = false; pickDefaultLang();
      syncProgress();
    } catch { S.offline = true; }
    S.loading = false; if (S.view === "home" || S.view === "stats") render();
  };
  const syncProgress = async () => {
    if (!pending.size || !S.me) return;
    const ids = [...pending];
    const updates = VOCAB.filter(w => pending.has(w.id)).map(w => ({ id: w.id, rightCount: w.r, wrongCount: w.w, lastPracticed: w.last }));
    try {
      const res = await fetch(API + "/progress", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ user: S.me, updates }) });
      if (res.ok) { ids.forEach(id => pending.delete(id)); store.set("pending_" + S.me, [...pending]); }
    } catch {}
  };

  /* ---------- Hilfen ---------- */
  const $ = (tag, attrs = {}, ...kids) => {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (k === "class") el.className = v;
      else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
      else if (v === true) el.setAttribute(k, "");
      else if (v !== false && v != null) el.setAttribute(k, v);
    }
    for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid.nodeType ? kid : document.createTextNode(kid));
    return el;
  };
  const colorFor = name => COLORS[[...name].reduce((a, c) => a + c.charCodeAt(0), 0) % COLORS.length];
  const PERSON_COLORS = { johanna: "#f2c40f", sophia: "#8e4fd6", sophie: "#8e4fd6", maximilian: "#22a35a" };
  const ICONS = { johanna: "🎨", sophia: "💄", sophie: "💄", maximilian: "🚀" };
  const avatar = name => {
    const icon = ICONS[name.toLowerCase()];
    const a = $("span", { class: "avatar" + (icon ? " has-icon" : "") }, icon || name[0].toUpperCase());
    a.style.background = PERSON_COLORS[name.toLowerCase()] || colorFor(name); return a;
  };
  const fmtDate = iso => new Date(iso + "T12:00:00").toLocaleDateString("de-AT", { day: "numeric", month: "short" });
  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const rateOf = st => st && (st.r + st.w) ? st.r / (st.r + st.w) : null;

  /* ---------- Antwort prüfen (tolerant für Sprache & Tippfehler) ---------- */
  const ARTICLES = /^(der|die|das|den|dem|ein|eine|einen|le|la|les|l|un|une|des|the|a|an|to|el|los|las|una|unos|unas)\s+/;
  const norm = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "")
    .replace(/[’']/g, " ").replace(/[^a-z0-9ß\s]/g, " ").replace(/\s+/g, " ").trim();
  const bare = s => { let t = norm(s), p; do { p = t; t = t.replace(ARTICLES, ""); } while (t !== p); return t; };
  const lev = (a, b) => {
    const m = a.length, n = b.length; if (!m) return n; if (!n) return m;
    let prev = Array.from({ length: n + 1 }, (_, i) => i);
    for (let i = 1; i <= m; i++) { const cur = [i]; for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); prev = cur; }
    return prev[n];
  };
  const isCorrect = (given, solution) => {
    const g = bare(given); if (!g) return false;
    return solution.split(/\s*[\/,;]\s*/).some(opt => {
      const o = bare(opt); const tol = o.length <= 4 ? 0 : o.length <= 8 ? 1 : 2;
      return g === o || lev(g, o) <= tol || g.split(" ").some(w => w === o);
    });
  };

  /* ---------- Sprachausgabe (Browser, klappt auch am iPhone) ---------- */
  let voices = [];
  const loadVoices = () => { try { voices = speechSynthesis.getVoices(); } catch {} };
  try { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; } catch {}
  const canSpeak = true;
  let ttsCap = null;
  if (window.claude?.use) window.claude.use("tts").then(t => { ttsCap = t; }).catch(() => {});
  const speakIssue = () => {
    if (S.speakIssue) return; S.speakIssue = true;
    const n = document.getElementById("speaknote"); if (n) n.hidden = false;
  };
  const speak = (text, langTag) => {
    const t = text.replace(/\s*\/\s*/g, ", ");
    let started = false, fell = false;
    const fallback = () => {
      if (fell || started) return; fell = true;
      if (ttsCap) ttsCap.speak(t, { language: langTag.slice(0, 2) }).then(() => { S.speakIssue = false; }).catch(speakIssue);
      else speakIssue();
    };
    if (!("speechSynthesis" in window)) { fallback(); return; }
    try {
      if (speechSynthesis.speaking || speechSynthesis.pending) speechSynthesis.cancel();
      try { speechSynthesis.resume(); } catch {}
      const u = new SpeechSynthesisUtterance(t);
      u.lang = langTag; u.rate = 0.9;
      const v = voices.find(v => v.lang === langTag) || voices.find(v => v.lang.replace("_", "-").startsWith(langTag.slice(0, 2)));
      if (v) u.voice = v;
      u.onstart = () => { started = true; S.speakIssue = false; const n = document.getElementById("speaknote"); if (n) n.hidden = true; };
      u.onerror = e => { if (e.error !== "interrupted" && e.error !== "canceled") fallback(); };
      speechSynthesis.speak(u);
      setTimeout(() => { if (!started && !speechSynthesis.speaking) fallback(); }, 1500);
    } catch { fallback(); }
  };

  /* ---------- Spracherkennung (Diktat über Claude, sonst Tippen) ---------- */
  /* Browser-Spracherkennung (Safari am iPhone, Chrome am Android) mit derselben Schnittstelle */
  const makeBrowserDictation = () => {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) return null;
    const h = { partial: [], final: [], state: [] };
    const emit = (k, e) => h[k].forEach(f => { try { f(e); } catch {} });
    let rec = null, reason = "stopped", got = false;
    return {
      start(opts = {}) {
        return new Promise((resolve, reject) => {
          try {
            rec = new SR();
            rec.lang = { fr: "fr-FR", en: "en-GB", es: "es-ES", de: "de-AT" }[opts.language] || "de-AT";
            rec.interimResults = true; rec.maxAlternatives = 5; rec.continuous = false;
            reason = "stopped"; got = false;
            rec.onstart = () => { emit("state", { state: "listening" }); resolve(); };
            rec.onresult = ev => {
              const r = ev.results[ev.results.length - 1];
              if (r.isFinal) {
                got = true;
                const alts = Array.from(r).map(a => a.transcript);
                emit("partial", { text: "" });
                emit("final", { text: alts[0] || "", alts });
              } else emit("partial", { text: r[0].transcript });
            };
            rec.onerror = ev => {
              reason = ev.error === "not-allowed" || ev.error === "service-not-allowed" ? "not_granted" : ev.error === "no-speech" ? "stopped" : "upstream_error";

          } catch (e) { reject({ code: "upstream_error" }); }
        });

      stop() { try { rec?.stop(); } catch {} return Promise.resolve(); },
      active() { return !!rec; },
      onPartial(f) { h.partial.push(f); return () => {}; },
      onFinal(f) { h.final.push(f); return () => {}; },
      onState(f) { h.state.push(f); return () => {}; },
    };
  };
  const getDictation = () => window.claude?.use
    ? window.claude.use("dictation").then(d => d || makeBrowserDictation())
    : Promise.resolve(makeBrowserDictation());

  let dict = null;
  getDictation().then(d => {
    dict = d;
    if (!d) return;
    d.onPartial(({ text }) => { const p = document.getElementById("partial"); if (p) p.textContent = text; });
    d.onFinal(({ text, alts }) => {
      if (!S.session || S.session.phase !== "ask") return;
      S.session.heard = (S.session.heard + text).trim();
      if (alts) { const sol = solutionText(cur().w); const hit = alts.find(a => isCorrect(a, sol)); if (hit) S.session.heard = hit.trim(); }
      d.stop().catch(() => {});
    });
    d.onState(({ state, reason }) => {
      S.listening = state !== "idle";
      const btn = document.getElementById("mic");
      if (btn) { btn.classList.toggle("listening", S.listening); btn.querySelector(".lbl").textContent = S.listening ? "Ich höre zu …" : "Antwort sagen"; }
      if (state === "idle") {
        if (S.session?.phase === "ask" && S.session.heard) evaluate(S.session.heard);
        else if (reason === "not_granted" || reason === "unavailable") { dict = null; S.micOff = true; render(); }
      }
    });
    render();
  }).catch(() => {});

  /* ---------- Auswahl der Übungswörter ---------- */
  const langWords = () => VOCAB.filter(w => w.lang === S.lang);
  const latestDate = () => langWords().reduce((m, w) => (w.date > m ? w.date : m), "");
  const pickWords = () => {
    let pool = langWords();
    if (S.cat !== "all") pool = pool.filter(w => w.cat === S.cat);
    const st = getStats();
    if (S.mode === "current") pool = pool.filter(w => w.date === (S.cat === "all" ? latestDate() : pool.reduce((m, w) => w.date > m ? w.date : m, "")));
    else if (S.mode === "month") { const d = new Date(); d.setDate(d.getDate() - 31); const lim = d.toISOString().slice(0, 10); pool = pool.filter(w => w.date >= lim); }
    let list;
    if (S.mode === "weak") {
      list = pool.filter(w => st[w.id]?.w > 0).sort((a, b) => rateOf(st[a.id]) - rateOf(st[b.id]) || st[b.id].w - st[a.id].w);
      if (!list.length) list = shuffle(pool);
    } else if (S.mode === "mixed") {
      const weak = shuffle(pool.filter(w => (rateOf(st[w.id]) ?? 0) < 0.7));
      const solid = shuffle(pool.filter(w => (rateOf(st[w.id]) ?? 0) >= 0.7));
      const nWeak = Math.ceil(Math.min(S.count, pool.length) * 0.7);
      list = shuffle([...weak.slice(0, nWeak), ...solid].slice(0, S.count).concat(weak.slice(nWeak)));
    } else list = shuffle(pool);
    return S.count === 0 ? list : list.slice(0, S.count);
  };

  /* ---------- Übung ---------- */
  const startSession = () => {
    const words = pickWords();
    if (!words.length) return;
    S.session = { queue: words.map(w => ({ w, retry: false })), idx: 0, total: words.length, results: {}, phase: "ask", heard: "" };
    S.view = "practice"; render(); focusEl("answer"); autoSpeakPrompt();
  };
  const cur = () => S.session.queue[S.session.idx];
  const promptText = w => S.dir === "de2fx" ? w.de : w.fx;
  const solutionText = w => S.dir === "de2fx" ? w.fx : w.de;
  const promptLang = () => S.dir === "de2fx" ? "de-DE" : LANGS[S.lang].tts;
  const answerLang = () => S.dir === "de2fx" ? LANGS[S.lang].tts : "de-DE";
  const autoSpeakPrompt = () => { if (S.autoSpeak && S.dir === "fx2de") speak(promptText(cur().w), promptLang()); };

  const record = (w, ok) => {
    const st = getStats(); const e = st[w.id] || { r: 0, w: 0 };
    ok ? e.r++ : e.w++; e.last = new Date().toISOString().slice(0, 10); st[w.id] = e; setStats(st);
    if (!(w.id in S.session.results)) S.session.results[w.id] = ok;
    if (!ok && !cur().retry) S.session.queue.push({ w, retry: true });
  };
  /* Fokus direkt im Tipp/Tastendruck setzen: nur so öffnet das iPhone die Tastatur von selbst */
  const focusEl = id => { const el = document.getElementById(id); if (el) try { el.focus({ preventScroll: true }); } catch {} };
  const evaluate = given => {
    const s = S.session; if (s.phase !== "ask") return;
    const w = cur().w; const ok = isCorrect(given, solutionText(w));
    s.phase = "feedback"; s.ok = ok; s.given = given; record(w, ok);
    const keepKeyboard = IS_IOS && document.activeElement && document.activeElement.id === "answer";
    render();
    if (keepKeyboard) focusEl("nextkey");
    if (S.dir === "de2fx") speak(solutionText(w), answerLang());
  };
  const revealSolution = () => { S.session.phase = "revealed"; render(); if (S.dir === "de2fx") speak(solutionText(cur().w), answerLang()); };
  const selfRate = ok => { const s = S.session; record(cur().w, ok); s.phase = "feedback"; s.ok = ok; s.given = null; s.self = true; next(); };
  const next = () => {
    const s = S.session; s.idx++; s.heard = ""; s.self = false;
    if (s.idx >= s.queue.length) { S.view = "results"; render(); syncProgress(); return; }
    s.phase = "ask"; render(); focusEl("answer"); autoSpeakPrompt();
  };
  const startMic = () => {
    if (!dict) return;
    if (S.listening) { dict.stop().catch(() => {}); return; }
    S.session.heard = "";
    dict.start({ language: LANGS[S.lang] && S.dir === "de2fx" ? LANGS[S.lang].dict : "de" }).catch(err => {
      if (err?.code === "not_granted" || err?.code === "unavailable") { dict = null; S.micOff = true; render(); }
    });
  };

  /* ---------- Ansichten ---------- */
  const viewPick = () => {
    const nameIn = $("input", { id: "newname", placeholder: "Anderer Name", maxlength: "20", "aria-label": "Neuer Name" });
    const add = () => { const n = nameIn.value.trim(); if (!n) return; if (!S.users.includes(n)) S.users.push(n); choose(n); };
    const choose = n => { S.me = n; save(); S.view = "home"; S.cat = "all"; loadWords(); };
    return [
      $("div", { class: "panel" },
        $("h1", {}, "Wer übt heute?"),
        $("p", { class: "muted", style: "margin:0" }, "Tipp einmal auf deinen Namen. Dieses Handy merkt sich das."),
        $("div", { class: "people" }, S.users.map(n => $("button", { class: "person", onclick: () => choose(n) }, avatar(n), n))),
        $("div", { class: "add-row" }, nameIn, $("button", { onclick: add }, "Dazu")),
      ),
    ];
  };

  const viewHome = () => {
    const words = langWords();
    const ld = latestDate();
    const latest = words.filter(w => w.date === ld);
    const cats = [...new Set(words.map(w => w.cat))];
    const latestCats = [...new Set(latest.map(w => w.cat))];
    const n = pickWords().length;
    const L = LANGS[S.lang];

    const settings = S.showSettings && $("div", { class: "panel settings", id: "settings" },
      $("h2", {}, "Feineinstellungen"),
      $("div", { class: "field" }, $("label", { for: "mode" }, "Was üben?"),
        sel("mode", S.mode, [["current","Letzter Import"],["weak","Schwierigste Wörter"],["month","Letzter Monat"],["mixed","Bunt gemischt"]], v => S.mode = v)),
      $("div", { class: "field" }, $("label", { for: "cat" }, "Thema"),
        sel("cat", S.cat, [["all","Alle Themen"], ...cats.map(c => [c, c])], v => S.cat = v)),
      $("div", { class: "field" }, $("label", { for: "count" }, "Wie viele Wörter?"),
        sel("count", String(S.count), [["10","10"],["20","20"],["50","50"],["100","100"],["200","200"],["0","Alle"]], v => S.count = +v)),
      $("label", { class: "toggle" }, $("input", { type: "checkbox", id: "autospeak", checked: S.autoSpeak, onchange: e => { S.autoSpeak = e.target.checked; save(); } }), "Fremdwörter automatisch vorlesen"),
    );

    const modeLabel = { current: "Letzter Import", weak: "Schwierigste Wörter", month: "Letzter Monat", mixed: "Bunt gemischt" }[S.mode];
    return [
      $("div", { class: "top" },
        $("button", { class: "who", onclick: () => { S.view = "pick"; render(); }, "aria-label": "Person wechseln" }, avatar(S.me), S.me),
        $("div", { style: "display:flex;gap:8px" },
          $("button", { class: "icon-btn", onclick: () => { S.showHelp = !S.showHelp; render(); }, "aria-label": "So funktioniert's", "aria-expanded": String(!!S.showHelp) }, "❓"),
          $("button", { class: "icon-btn", onclick: () => { S.view = "stats"; render(); }, "aria-label": "Meine Wörter" }, "📊"),
          $("button", { class: "icon-btn", onclick: () => { S.showSettings = !S.showSettings; render(); }, "aria-label": "Feineinstellungen", "aria-expanded": String(S.showSettings) }, "⚙️")),
      ),
      S.showHelp && howTo(),
      S.offline && $("div", { class: "demo-note" }, "Keine Verbindung. Du übst mit den Wörtern, die auf diesem Handy gespeichert sind."),
      S.loading && $("div", { class: "panel empty muted" }, "Deine Vokabeln werden geladen …"),
      !S.loading && !VOCAB.length && $("div", { class: "panel" },
        $("h2", {}, "Noch keine Vokabeln"),
        $("p", { class: "muted", style: "margin:0" }, "Fotografiere die Seiten aus deinem Vokabelheft. Die App liest die Wörter aus und fragt dich dann genau diese ab."),
        $("button", { class: "big primary", onclick: openImport }, "📷 Erste Seiten fotografieren")),
      $("div", { class: "panel" },
        $("div", { class: "langs", role: "group", "aria-label": "Sprache" },
          Object.entries(LANGS).map(([k, l]) => { const c = VOCAB.filter(w => w.lang === k).length; return $("button", { class: "chip" + (c ? "" : " empty-lang"), "aria-pressed": String(S.lang === k), onclick: () => { S.lang = k; S.cat = "all"; save(); render(); } },
            $("span", { class: "flag" }, l.short), $("span", { class: "small" }, l.name), $("span", { class: "small muted" }, c + " Wörter")); })),
        $("button", { class: "dir", onclick: () => { S.dir = S.dir === "de2fx" ? "fx2de" : "de2fx"; save(); render(); }, "aria-label": "Richtung wechseln" },
          S.dir === "de2fx" ? "Deutsch" : L.name, $("span", { class: "swap" }, "⇄"), S.dir === "de2fx" ? L.name : "Deutsch"),
        $("div", { class: "import-info muted" },
          $("span", {}, "Letzter Import: ", $("b", {}, ld ? fmtDate(ld) : "–"), " · ", latest.length, " Wörter"),
          $("span", {}, latestCats.map(c => $("span", { class: "tag" }, c)))),
      ),
      settings,
      $("button", { class: "big primary", onclick: startSession, disabled: !n }, "▶ ", S.mode === "current" && S.cat === "all" ? "Aktuellen Import üben" : modeLabel + " üben"),
      $("p", { class: "hint-line muted small", style: "margin:-6px 0 0" }, n ? `${n} Wörter · ${S.cat === "all" ? "alle Themen" : S.cat}` : "Für diese Auswahl gibt es noch keine Wörter."),
      $("button", { class: "big secondary", onclick: openImport }, "📷 Neue Seiten fotografieren"),
    ];
  };

  /* ---------- Fotos importieren ---------- */
  const IMP = { files: [], busy: false, error: "", result: null };
  const openImport = () => { IMP.files = []; IMP.error = ""; IMP.result = null; S.view = "import"; render(); };
  const shrink = file => new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => {
      const k = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      resolve(c.toDataURL("image/jpeg", 0.82));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("Ein Foto konnte nicht geöffnet werden.")); };
    img.src = url;
  });
  const runImport = async () => {
    if (!IMP.files.length || IMP.busy) return;
    IMP.busy = true; IMP.error = ""; render();
    try {
      const images = await Promise.all(IMP.files.map(shrink));
      let res;
      try { res = await fetch(API + "/import", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ user: S.me, images }) }); }
      catch { throw new Error("Keine Verbindung zum Server. Prüf das Internet und versuch es nochmal."); }
      const data = await res.json().catch(() => ({}));
      if (!res.ok || data.error) throw new Error(data.error || "Das Auslesen hat nicht geklappt (Fehler " + res.status + "). Bitte nochmal versuchen.");
      const ids = new Set((data.words || []).map(w => w.id));
      await loadWords();
      let found = VOCAB.filter(w => ids.has(w.id));
      if (!found.length) found = (data.words || []).map(fromRow);
      IMP.result = found; IMP.files = [];
      if (found[0]) { S.lang = found[0].lang; S.mode = "current"; S.cat = "all"; save(); }
    } catch (e) { IMP.error = e.message || "Das hat nicht geklappt. Bitte nochmal versuchen."; }
    IMP.busy = false; S.view = "import"; render();
  };
  const viewImport = () => {
    const back = $("div", { class: "top" }, $("button", { class: "linkish", onclick: () => { S.view = "home"; render(); } }, "← Zurück"), $("span", { class: "who" }, avatar(S.me), S.me));
    if (IMP.busy) return [back, $("div", { class: "panel empty" },
      $("div", { class: "spinner", "aria-hidden": "true" }),
      $("h2", {}, "Deine Seiten werden gelesen …"),
      $("p", { class: "muted", style: "margin:0" }, "Das dauert meistens 20 bis 40 Sekunden. Bitte die App offen lassen."))];
    if (IMP.result) {
      const r = IMP.result, L = LANGS[r[0]?.lang] || LANGS.en;
      const cats = [...new Set(r.map(w => w.cat))];
      return [back, $("div", { class: "panel" },
        $("h1", {}, r.length + " Wörter gefunden"),
        $("div", { class: "import-info" }, $("span", { class: "tag" }, L.name), cats.map(c => $("span", { class: "tag" }, c + " · " + r.filter(w => w.cat === c).length))),
        $("ul", { class: "wordlist" }, r.map(w => $("li", {}, $("span", { class: "dot n" }, "·"), $("span", { class: "w" }, w.fx, $("small", {}, w.de)), $("span", { class: "small muted" }, w.cat)))),
        $("p", { class: "muted small", style: "margin:0" }, "Stimmt ein Wort nicht? Sag Bescheid, dann wird es korrigiert.")),
        $("div", { class: "row-btns" },
          $("button", { onclick: openImport }, "Weitere Seiten"),
          $("button", { class: "primary", onclick: () => { S.view = "home"; startSession(); } }, "▶ Jetzt üben"))];
    }
    const cam = $("input", { type: "file", accept: "image/*", capture: "environment", id: "cam", hidden: true, onchange: e => { IMP.files.push(...e.target.files); e.target.value = ""; IMP.error = ""; render(); } });
    const gal = $("input", { type: "file", accept: "image/*", multiple: true, id: "gal", hidden: true, onchange: e => { IMP.files.push(...e.target.files); e.target.value = ""; IMP.error = ""; render(); } });
    const thumbs = IMP.files.map((f, i) => { const u = URL.createObjectURL(f);
      return $("div", { class: "thumb" }, $("img", { src: u, alt: "Seite " + (i + 1), onload: () => URL.revokeObjectURL(u) }),
        $("button", { class: "thumb-x", "aria-label": "Seite " + (i + 1) + " entfernen", onclick: () => { IMP.files.splice(i, 1); render(); } }, "✕"),
        $("span", { class: "thumb-n" }, String(i + 1))); });
    return [back, $("div", { class: "panel" },
      $("h1", {}, "Neue Seiten"),
      $("p", { class: "muted", style: "margin:0" }, "Fotografiere jede Vokabelseite einzeln, gerade von oben und gut beleuchtet. Bis zu 8 Seiten auf einmal."),
      cam, gal,
      thumbs.length ? $("div", { class: "thumbs" }, thumbs) : null,
      IMP.files.length < 8 && $("div", { class: "row-btns" },
        $("button", { class: "primary", onclick: () => cam.click() }, IMP.files.length ? "📷 Noch eine Seite" : "📷 Seite fotografieren"),
        $("button", { onclick: () => gal.click() }, "🖼 Aus Fotos wählen")),
      IMP.error && $("div", { class: "feedback bad" }, $("div", { class: "small" }, IMP.error))),
      $("button", { class: "big primary", onclick: runImport, disabled: !IMP.files.length }, IMP.files.length ? `✨ ${IMP.files.length} ${IMP.files.length === 1 ? "Seite" : "Seiten"} auslesen` : "✨ Auslesen")];
  };
  const DEMO_HTML = `
    <div class="demo-stage" aria-hidden="true">
      <div class="sc sc1">
        <div class="d-btn">📷 Neue Seiten fotografieren<span class="d-tap"></span></div>
        <div class="d-photo"><i></i><i></i><i></i><i></i></div>
      </div>
      <div class="sc sc2">
        <div class="d-page"><div class="d-row"><b>der Apfel</b><span>la pomme</span></div><div class="d-row"><b>die Birne</b><span>la poire</span></div><div class="d-row"><b>essen</b><span>manger</span></div><div class="d-scan"></div></div>
        <div class="d-badge">FR · Französisch erkannt ✓</div>
      </div>
      <div class="sc sc3">
        <div class="d-card"><small>DEUTSCH</small><div class="d-word">der Apfel</div>
          <div class="d-mic">🎤 Antwort sagen</div>
          <div class="d-ans"><span class="d-typed">la pomme</span></div>
          <div class="d-ok">Richtig! 🎉</div></div>
      </div>
    </div>
    <ol class="demo-steps">
      <li class="st st1"><b>Fotografieren:</b> Knopf drücken, Vokabelseiten fotografieren.</li>
      <li class="st st2"><b>Auslesen:</b> Wörter und Sprache werden automatisch erkannt.</li>
      <li class="st st3"><b>Loslegen:</b> Antwort sagen 🎤 oder eintippen.</li>
    </ol>`;
  const demoAnim = () => { const d = $("div", { class: "demo" }); d.innerHTML = DEMO_HTML; return d; };
  const howTo = () => {
    const d = $("div", { class: "panel howto", id: "howto" },
      $("div", { class: "howto-head" }, $("h2", {}, "So funktioniert's"),
        $("button", { class: "linkish", onclick: () => { S.showHelp = false; store.set("helpSeen", true); render(); } }, "Schließen")),
      demoAnim(),
      $("p", { class: "muted small", style: "margin:0" }, "Tipp: Am iPhone in Safari öffnen und über Teilen → „Zum Home-Bildschirm“ wie eine App ablegen."));
    return d;
  };
  const sel = (id, value, opts, onchange) => {
    const s = $("select", { id, onchange: e => { onchange(e.target.value); save(); render(); } }, opts.map(([v, t]) => $("option", { value: v }, t)));
    s.value = value; return s;
  };

  const viewPractice = () => {
    const s = S.session, item = cur(), w = item.w, L = LANGS[S.lang];
    const done = Object.keys(s.results).length;
    const head = $("div", { class: "p-head" },
      $("button", { class: "linkish", onclick: () => { try { speechSynthesis.cancel(); } catch {} dict?.stop().catch(() => {}); S.view = done ? "results" : "home"; render(); syncProgress(); } }, "← Beenden"),
      $("span", { class: "muted small" }, item.retry ? "Nochmal: " : "", `${Math.min(s.idx + 1, s.queue.length)} / ${s.queue.length}`));
    const bar = $("div", { class: "progress", "aria-hidden": "true" }, $("span", { style: `width:${(s.idx / s.queue.length) * 100}%` }));

    const pLang = promptLang();
    const card = $("div", { class: "card" },
      $("div", {},
        $("div", { class: "prompt-label" }, (S.dir === "de2fx" ? "Deutsch" : L.name) + " · " + w.cat),
        $("div", { class: "prompt-row" },
          $("div", { class: "prompt" }, promptText(w)),
          canSpeak && $("button", { class: "speak", onclick: () => speak(promptText(w), pLang), "aria-label": "Vorlesen" }, "🔊"))),
      $("div", { class: "kbhint", id: "speaknote", hidden: !S.speakIssue },
        "Vorlesen klappt hier gerade nicht. Am iPhone: Lautlos-Schalter aus und Lautstärke rauf."),
    );

    if (s.phase === "ask") {
      const target = S.dir === "de2fx" ? L.name : "Deutsch";
      const input = $("input", { id: "answer", autocomplete: "off", autocapitalize: "off", spellcheck: "false", enterkeyhint: "done",
        placeholder: IS_IOS ? "Antwort …" : "Auf " + target + " …", "aria-label": "Antwort" });
      const check = () => input.value.trim() && evaluate(input.value);
      input.addEventListener("keydown", e => { if (e.key === "Enter") check(); });
      const answerRow = $("div", { class: "answer-row" + (IS_IOS ? " big-answer" : "") }, input, $("button", { class: "check", onclick: check }, "Prüfen"));
      if (IS_IOS) {
        /* iPhone/iPad: Spracherkennung im Browser ist unzuverlässig, deshalb Diktat über die Tastatur */
        card.append(answerRow,
          $("div", { class: "kbhint" },
            "Zum Sprechen das ", $("b", {}, "🎤 auf der Tastatur"), " drücken und die Antwort sagen. Mit ", $("b", {}, "Fertig/Return"), " prüfen, nochmal ", $("b", {}, "Return"), " für das nächste Wort.",
            $("br"), $("span", { class: "muted" }, "Achte darauf, dass die Tastatur auf " + target + " steht (🌐 gedrückt halten).")));
      } else {
        const kbHint = $("div", { class: "kbhint", id: "kbhint", hidden: !S.showKbHint },
          "Tipp jetzt auf das ", $("b", {}, "🎤 auf deiner Tastatur"), " und sag die Antwort. Dann auf ", $("b", {}, "Prüfen"), ".",
          $("br"), $("span", { class: "muted" }, "Tastatur auf " + target + " stellen (🌐), dann versteht sie dich besser."));
        const micClick = () => {
          if (dict && !S.micOff) { startMic(); return; }
          S.showKbHint = true; kbHint.hidden = false; input.focus();
        };
        card.append(
          $("button", { class: "mic" + (S.listening ? " listening" : ""), id: "mic", onclick: micClick }, "🎤 ", $("span", { class: "lbl" }, S.listening ? "Ich höre zu …" : "Antwort sagen")),
          $("div", { class: "partial", id: "partial", "aria-live": "polite" }),
          kbHint,
          $("div", { class: "or muted small" }, "oder tippen"),
          answerRow);
      }
      card.append($("button", { class: "reveal", onclick: revealSolution }, "Lösung anschauen"));
    } else if (s.phase === "revealed") {
      card.append(
        $("div", { class: "feedback neutral" },
          $("div", { class: "prompt-label" }, "Lösung"),
          solutionRow(w)),
        $("p", { class: "muted small", style: "margin:0;text-align:center" }, "Hast du es gewusst?"),
        $("div", { class: "selfrate" },
          $("button", { class: "yes", onclick: () => selfRate(true) }, "✓ Gewusst"),
          $("button", { class: "no", onclick: () => selfRate(false) }, "✗ Nicht gewusst")));
    } else {
      card.append(
        $("div", { class: "feedback " + (s.ok ? "good" : "bad") },
          $("div", { class: "fb-title" }, s.ok ? "Richtig! 🎉" : "Noch nicht ganz"),
          s.given != null && $("div", { class: "small" }, "Deine Antwort: ", $("b", {}, s.given)),
          solutionRow(w),
          !s.ok && $("div", { class: "small muted" }, "Das Wort kommt am Ende nochmal.")),
        $("button", { class: "next", id: "nextbtn", onclick: next }, "Weiter →"),
        IS_IOS && $("input", { id: "nextkey", class: "ghost-input", enterkeyhint: "next", autocomplete: "off", "aria-label": "Weiter mit der Eingabetaste",
          onkeydown: e => { if (e.key === "Enter") { e.preventDefault(); next(); } }, oninput: e => { e.target.value = ""; } }));
      if (!IS_IOS) setTimeout(() => document.getElementById("nextbtn")?.focus({ preventScroll: true }), 30);
    }
    return [head, bar, card];
  };
  const solutionRow = w => $("div", { class: "solution" }, solutionText(w),
    canSpeak && $("button", { class: "speak", onclick: () => speak(solutionText(w), answerLang()), "aria-label": "Lösung vorlesen" }, "🔊"));

  const viewResults = () => {
    const s = S.session, ids = Object.keys(s.results);
    const good = ids.filter(id => s.results[id]).length, bad = ids.length - good;
    const byId = Object.fromEntries(VOCAB.map(w => [w.id, w]));
    const sorted = ids.sort((a, b) => s.results[a] - s.results[b]);
    return [
      $("div", { class: "panel" },
        $("h1", {}, good === ids.length && ids.length ? "Alles gewusst! 🌟" : "Geschafft!"),
        $("div", { class: "score" }, $("div", { class: "g" }, $("b", {}, good), "gewusst"), $("div", { class: "b" }, $("b", {}, bad), "noch üben")),
        $("ul", { class: "wordlist" }, sorted.map(id => { const w = byId[id], ok = s.results[id];
          return $("li", {}, $("span", { class: "dot " + (ok ? "g" : "b") }, ok ? "✓" : "✗"), $("span", { class: "w" }, w.fx, $("small", {}, w.de)), $("span", {})); })),
      ),
      $("div", { class: "row-btns" },
        $("button", { onclick: () => { S.view = "home"; render(); } }, "Zur Startseite"),
        $("button", { class: "primary", onclick: () => { const ids2 = new Set(ids.filter(id => !s.results[id])); if (ids2.size) { S.session = { queue: shuffle(VOCAB.filter(w => ids2.has(w.id))).map(w => ({ w, retry: false })), idx: 0, total: ids2.size, results: {}, phase: "ask", heard: "" }; S.view = "practice"; render(); autoSpeakPrompt(); } else startSession(); } }, bad ? "Fehler nochmal üben" : "Neue Runde")),
    ];
  };

  const viewStats = () => {
    const st = getStats(), words = langWords();
    const practiced = words.filter(w => st[w.id]).sort((a, b) => rateOf(st[a.id]) - rateOf(st[b.id]));
    const fresh = words.filter(w => !st[w.id]);
    const cats = [...new Set(words.map(w => w.cat))];
    const pct = r => Math.round(r * 100);
    const barColor = r => r >= .8 ? "var(--good)" : r >= .5 ? "var(--marker)" : "var(--bad)";
    return [
      $("div", { class: "top" },
        $("button", { class: "linkish", onclick: () => { S.view = "home"; render(); } }, "← Zurück"),
        $("span", { class: "who" }, avatar(S.me), S.me)),
      $("div", { class: "panel" },
        $("h1", {}, "Meine Wörter · " + LANGS[S.lang].name),
        $("div", { class: "import-info" }, cats.map(c => {
          const cw = words.filter(w => w.cat === c && st[w.id]);
          const r = cw.length ? cw.reduce((a, w) => a + rateOf(st[w.id]), 0) / cw.length : null;
          return $("span", { class: "tag" }, c, r == null ? " · neu" : ` · ${pct(r)} %`);
        })),
        practiced.length ? $("ul", { class: "wordlist" }, practiced.map(w => { const e = st[w.id], r = rateOf(e);
          const b = $("span", { class: "bar" }, $("span", { style: `width:${pct(r)}%;background:${barColor(r)}` }));
          return $("li", {}, $("span", { class: "dot " + (r >= .5 ? "g" : "b") }, r >= .5 ? "✓" : "✗"), $("span", { class: "w" }, w.fx, $("small", {}, `${w.de} · ${e.r}× richtig, ${e.w}× falsch`)), $("span", { class: "rate" }, pct(r) + " %", b));
        })) : $("p", { class: "empty muted" }, "Noch nichts geübt. Starte eine Runde, dann siehst du hier, welche Wörter sitzen."),
        fresh.length > 0 && $("p", { class: "muted small", style: "margin:0" }, `${fresh.length} Wörter noch nie geübt.`),
      ),
    ];
  };

  const render = () => {
    if (!S.me) S.view = "pick";
    else if (!S.view) S.view = "home";
    const app = document.getElementById("app");
    const v = { pick: viewPick, home: viewHome, practice: viewPractice, results: viewResults, stats: viewStats, import: viewImport }[S.view]();
    app.replaceChildren(...v.filter(Boolean));
  };
  render();
  if (S.me) loadWords();
})();
</script>

</body>
</html>
